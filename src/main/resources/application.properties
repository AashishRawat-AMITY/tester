spring.application.name=cybercup-backend
server.address=0.0.0.0
server.port=8080

# MySQL Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/cybercup_db
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=As16081982#

# MySQL Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

security.jwt.secret=${JWT_SECRET}

# AI engine connection
ai.engine.base-url=${AI_ENGINE_BASE_URL:http://localhost:8000}
ai.engine.analyze-path=/analyze
ai.engine.connect-timeout=3s
ai.engine.read-timeout=60s
